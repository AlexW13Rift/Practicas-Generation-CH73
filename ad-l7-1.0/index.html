
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD-13 | Inicio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

      <a class="navbar-brand" href="index.html">Navbar</a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">
              Inicio
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index2.html">
              index2
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <div class="container mt-4 d-flex flex-column">

    <h1>Componentes Bootstrap</h1>

    <button id="elBoton" class="btn btn-primary mb-3">
      El Botón
    </button>

    <div id="alertaContenedor"></div>

    <div class="row text-center">

      <div class="col-md-2 bg-primary text-white p-3">
        El lado izquierdo
      </div>

      <div class="col-md-8 bg-light p-3">
        El lado central
        <form id="formulario" class="mt-4">

          <div class="mb-3 text-start">
            <label for="correo" class="form-label">
              Correo electrónico
            </label>

            <input type="email"
              class="form-control"
              id="correo"
              placeholder="nombre@ejemplo.com"
              required>
          </div>

          <div class="mb-3 text-start">
            <label for="mensaje" class="form-label">
              Mensaje
            </label>

            <textarea
              class="form-control"
              id="mensaje"
              rows="4"
              required></textarea>
          </div>

          <button type="submit" class="btn btn-success">
            Enviar
          </button>

        </form>

      </div>

      <div class="col-md-2 bg-primary text-white p-3">
        El lado derecho
      </div>

    </div>

    <div class="row">
      <div class="col-12 bg-dark text-white text-center p-3">
        Pie de página
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>

</body>
</html>
