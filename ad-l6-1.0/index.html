<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uso de Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <div class="container">

  <h1>Usando Bootstrap</h1>
  <p>Probando la anchura del contenedor.</p>
  <button type="button" class="btn btn-primary">Azul</button>
  <button type="button" class="btn btn-success">Verde</button>
  <button type="button" class="btn btn-danger">Rojo</button>
  <p class="text-start">Izquierda</p>

  <p class="text-center text-danger">Centro</p>

  <p class="text-end">Derecha</p>

  <div class="card" style="width: 16rem;">

  <div class="card-header">
    Hoja de ruta
  </div>

  <img src="/Images/Cesta.webp"
       class="card-img-top"
       alt="Cesta de frutas">

  <ul class="list-group list-group-flush">
    <li class="list-group-item">Manzana</li>
    <li class="list-group-item">Naranja</li>
    <li class="list-group-item">Plátano</li>
  </ul>

</div>

</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
